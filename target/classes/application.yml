spring:
  application:
    name: parkgrid-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/parkingslot?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${SERVER_PORT:8080}
parkgrid:
  jwt-secret: ${JWT_SECRET:change-this-secret-to-a-32-character-value}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
